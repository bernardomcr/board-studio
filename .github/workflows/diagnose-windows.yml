name: Windows browser diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-windows.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: windows-browser-diagnostics
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Report diagnostics started
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=pending -f context=board-studio/runner-diagnostics -f description='Checking Windows browser boot' -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic status could not be registered' }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Install matched headless browser
        timeout-minutes: 5
        run: npx playwright install chromium --only-shell
        working-directory: app
      - name: Native momentum with nonintrusive API tracing
        timeout-minutes: 12
        run: npm test -- tests/motion-v17.spec.ts tests/navigation-v13.spec.ts tests/performance-v14.spec.ts --grep "automatic saving waits for momentum|native background drag|zoom controls interrupt a fling|Space autorepeat" --reporter=line,./tests/reporters/github-status.cjs
        working-directory: app
        env:
          CI: 'true'
          GH_TOKEN: ${{ github.token }}
          BOARD_TEST_STATUS_CONTEXT: board-studio/runner-diagnostics
          BOARD_TEST_STEPS: 'true'
          PLAYWRIGHT_BUNDLED_BROWSER: 'true'
          BOARD_TEST_GPU_PROBE: 'true'
          BOARD_TEST_PAUSE_RENDERER: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-diagnostics-${{ github.run_id }}
          path: app/test-results
          retention-days: 3
          if-no-files-found: ignore
      - name: Report diagnostic result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:DIAGNOSTIC_JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f "state=$state" -f context=board-studio/runner-diagnostics -f "description=Browser diagnostics: $env:DIAGNOSTIC_JOB_STATUS" -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --silent
